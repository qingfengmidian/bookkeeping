name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.12']
        exclude:
          # ubuntu-latest（26.04）的 setup-python 不再提供已 EOL 的 Python 3.9
          - os: ubuntu-latest
            python-version: '3.9'
        include:
          # Python 3.9 在 ubuntu-24.04 运行器上测试
          - os: ubuntu-24.04
            python-version: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linux 运行器的 Python 默认不带 tkinter，而测试会 import tkinter 模块
      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest test/ -q
