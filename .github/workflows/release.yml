name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows exe (onefile)
        id: build
        run: pyinstaller --onefile --windowed --name bookkeeping main.py

      - name: Upload exe to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/bookkeeping.exe --clobber

      - name: Upload exe to Gitee release
        if: always() && steps.build.outcome == 'success'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (git describe --tags --abbrev=0)
          }
          Write-Host "Target tag: $tag"
          $releases = Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/qingfengmidian/bookkeeping/releases" -Body @{ access_token = $env:GITEE_TOKEN }
          $rel = $releases | Where-Object { $_.tag_name -eq $tag }
          if (-not $rel) {
            Write-Host "Release $tag not found on Gitee, creating..."
            $body = @{ access_token = $env:GITEE_TOKEN; tag_name = $tag; target_commitish = "master"; name = $tag }
            $rel = Invoke-RestMethod -Method Post -Uri "https://gitee.com/api/v5/repos/qingfengmidian/bookkeeping/releases" -Body $body
          }
          curl.exe -s -X POST "https://gitee.com/api/v5/repos/qingfengmidian/bookkeeping/releases/$($rel.id)/attach_files" -F "access_token=$env:GITEE_TOKEN" -F "file=@dist/bookkeeping.exe"

      - name: Upload exe artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeping-windows
          path: dist/bookkeeping.exe
